backend:
  name: github
  repo: bksehsbalkans/bksehsbalkans
  branch: main

media_folder: "images"
public_folder: "/images"

collections:
  - name: "research"
    label: "Research"
    folder: "content/research"
    create: true
    fields:
      - {name: "slug", label: "Slug", widget: "string"}
      - {name: "date", label: "Tarih", widget: "datetime"}
      - {name: "title", label: "Baslik", widget: "string"}
      - {name: "body", label: "Icerik", widget: "markdown"}

  - name: "news"
    label: "News"
    folder: "content/news"
    create: true
    fields:
      - {name: "slug", label: "Slug", widget: "string"}
      - {name: "date", label: "Tarih", widget: "datetime"}
      - {name: "title", label: "Baslik", widget: "string"}
      - {name: "body", label: "Icerik", widget: "markdown"}
