backend:
  name: github
  repo: bksehsbalkans/bksehsbalkans
  branch: main

media_folder: "images"
public_folder: "/images"

collections:
  - name: "research"
    label: "Research"
    folder: "content/research"
    create: true
    slug: "{{slug}}"
    fields:
      - {name: "slug", label: "Slug (Kısa İsim / URL)", widget: "string"}
      - {name: "date", label: "Tarih", widget: "datetime"}
      - {name: "image", label: "Kapak Fotoğrafı", widget: "image", required: false}
      - {name: "pdf", label: "PDF Dosyası", widget: "file", required: false}
